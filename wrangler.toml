name = "article-import-service"
main = "src/index.js"
compatibility_date = "2024-07-01"
workers_dev = true

[vars]
ALLOW_HOSTS = "www.rt.com,*.bbc.com,edition.cnn.com,www.nytimes.com"
MAX_BYTES = "4000000"
SOURCES_JSON = "{}"
FEED_CACHE_TTL = "300"

[[kv_namespaces]]
binding = "FEEDS_CACHE"
id = "00000000000000000000000000000000"
preview_id = "11111111111111111111111111111111"

[[triggers]]
crons = ["*/5 * * * *"]
